# Fly.io config for the atizar demo. ONE 1GB shared VM, ALWAYS ON (no auto-stop) — the demo DB is
# in-memory (PGlite), so state must live on a single, non-sleeping machine to stay consistent during
# a show. DEMO=1 = zero-credential mode (PGlite + committed cassettes).
app = "atizar"
primary_region = "fra"

[build]

[env]
  DEMO = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on, single machine: never sleep (so the in-memory board doesn't wipe mid-demo) and never
  # split state across machines. Keep exactly 1 machine (Fly dashboard → Edit app scale → 1).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
